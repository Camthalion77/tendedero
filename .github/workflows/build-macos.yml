name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - greek-translation-build

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Check translations
        run: swift scripts/check-strings.swift
      - name: Build universal app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          swift --version
          xcrun --show-sdk-path
          set +e
          scripts/build-app.sh release 2>&1 | tee "$RUNNER_TEMP/tendedero-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/tendedero-build.log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          errors = [line for line in lines if "error:" in line]
          for line in (errors or lines[-20:])[:20]:
              message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{message}")
          PYTHON
            {
              echo '### Build failure'
              echo '```text'
              tail -n 150 "$RUNNER_TEMP/tendedero-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent build/Tendedero.app build/Tendedero-macOS.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Tendedero-macOS
          path: build/Tendedero-macOS.zip
          if-no-files-found: error
          retention-days: 14
